name: Holonic governance review

# Repository-neutral PR-review workflow installed by the Holonic onboarding service.
# Every repo-/endpoint-specific value is a {{PLACEHOLDER}} substituted at install time
# (see templates/README.md).
#
# Security model (mirrors the FTGO forks):
#   * TRUSTED base-branch workflow. `pull_request_target` runs it in the BASE repository's
#     context on the default-branch copy of this file, so an untrusted PR branch cannot read
#     `secrets.HOLONIC_API_KEY` or change the rules by editing the workflow on its branch.
#   * It NEVER checks out or executes PR code -- it only reads the PR's textual diff via the
#     GitHub API and forwards it to the Holonic review endpoint.
#   * The governance rules live in the Holonic Lambda image, not in this repository.
#   * The review endpoint validates HOLONIC_API_KEY, resolves the tenant, and reviews the
#     change against that tenant's baseline.

on:
  pull_request_target:
    branches: ["master"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    if: github.repository == 'jasongeorgis/ftgo'
    runs-on: ubuntu-latest
    # A review takes minutes. The endpoint starts it and answers at once; this job then polls for the outcome.
    timeout-minutes: 20
    steps:
      - name: Holonic governance review
        env:
          API_KEY: ${{ secrets.HOLONIC_API_KEY }}
          VERIFY_URL: "https://se5kckxtvj.execute-api.us-east-1.amazonaws.com/demo/verify-checks"
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status() {   # state (pending|success|failure|error), description (GitHub keeps 140 characters)
            gh api --method POST "repos/${OWNER}/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="Holonic / Governance review" -f description="${2:0:140}" >/dev/null || true
          }
          status pending "Holonic review running"
          # The PR's unified diff (read-only API; no PR code is checked out or executed).
          DIFF=$(gh api "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}" -H "Accept: application/vnd.github.v3.diff" || true)
          jq -n \
            --arg pn "${PR_NUMBER}" --arg title "${PR_TITLE}" --arg owner "${OWNER}" --arg repo "${REPO}" \
            --arg sha "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg diff "${DIFF}" --arg key "${API_KEY}" \
            '{mode: "start", pull_request_number: ($pn|tonumber), pull_request_title: $title, owner: $owner,
              repo: $repo, sha: $sha, base_sha: $base, diff: $diff, api_key: $key}' > /tmp/holonic-start.json
          CODE=$(curl -sS -m 60 -o /tmp/holonic-started.json -w '%{http_code}' -X POST "${VERIFY_URL}" \
                 -H 'Content-Type: application/json' --data-binary @/tmp/holonic-start.json || echo 000)
          echo "start: HTTP ${CODE}"; cat /tmp/holonic-started.json || true; echo
          REVIEW_ID=$(jq -r '.review_id // empty' /tmp/holonic-started.json 2>/dev/null || true)

          # Only an explicit DONE + PASS is a success; every other outcome is reported as failure or error.
          STATE=error; RESULT="The review couldn't be started (HTTP ${CODE})"
          if [ "${CODE}" = "202" ] && [ -n "${REVIEW_ID}" ]; then
            jq -n --arg id "${REVIEW_ID}" --arg key "${API_KEY}" '{mode: "status", review_id: $id, api_key: $key}' \
              > /tmp/holonic-poll.json
            RESULT="The review didn't finish within 15 minutes"
            for _ in $(seq 1 60); do
              sleep 15
              curl -sS -m 30 -o /tmp/holonic-status.json -X POST "${VERIFY_URL}" \
                -H 'Content-Type: application/json' --data-binary @/tmp/holonic-poll.json || continue
              case "$(jq -r '.status // empty' /tmp/holonic-status.json 2>/dev/null || true)" in
                DONE)
                  RESULT=$(jq -r '.decision // "ERROR"' /tmp/holonic-status.json)
                  STATE=failure; [ "${RESULT}" = "PASS" ] && STATE=success
                  break ;;
                ERROR)
                  RESULT="The review couldn't complete: $(jq -r '.reason // "unknown reason"' /tmp/holonic-status.json)"
                  break ;;
              esac
            done
          fi
          echo "result: ${STATE}: ${RESULT}"
          status "${STATE}" "${RESULT}"
          gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" \
            --body "Holonic governance review: **${RESULT}**" >/dev/null 2>&1 || true
          [ "${STATE}" = "success" ]
